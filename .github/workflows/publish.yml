name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # requis par le trusted publishing npm (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Le trusted publishing exige npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      # Aucun NODE_AUTH_TOKEN : npm echange le jeton OIDC de GitHub
      # contre un jeton de publication ephemere.
      - run: npm publish
